<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5b9bd5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a8ac4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pages" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0f0f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d0d0dd;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="#0a0a0f"/>
  
  <!-- Book cover left -->
  <rect x="28" y="22" width="44" height="84" rx="6" fill="url(#cover)"/>
  
  <!-- Book pages right -->
  <rect x="44" y="26" width="48" height="76" rx="4" fill="url(#pages)"/>
  
  <!-- Spine lines -->
  <line x1="32" y1="38" x2="60" y2="38" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  <line x1="32" y1="48" x2="60" y2="48" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  <line x1="32" y1="58" x2="60" y2="58" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  <line x1="32" y1="68" x2="60" y2="68" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  
  <!-- Bookmark ribbon -->
  <polygon points="72,22 84,22 84,44 78,38 72,44" fill="#e5c07b"/>
</svg>