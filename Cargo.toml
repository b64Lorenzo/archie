[workspace]
members = ["src-tauri"]
resolver = "2"

[workspace.dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
ignore = "0.4"
glob = "0.3"
md5 = "0.7"
rayon = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
open = "5"
rfd = "0.14"
